version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/platform/postgres/migrations"
    queries: "internal/platform/postgres/queries"
    gen:
      go:
        package: "db"
        out: "internal/platform/postgres/db"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type:
              import: "time"
              type: "Time"
          - db_type: timestamptz
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "users.id"
            go_type:
              type: "UserID"
              import: "github.com/iamconnor4/surge/internal/domain"
          - column: "venues.id"
            go_type:
              type: "VenueID"
              import: "github.com/iamconnor4/surge/internal/domain"
          - column: "venue_sections.id"
            go_type:
              type: "VenueSectionID"
              import: "github.com/iamconnor4/surge/internal/domain"
          - column: "venue_sections.venue_id"
            go_type:
              type: "VenueID"
              import: "github.com/iamconnor4/surge/internal/domain"
          - column: "venue_seats.id"
            go_type:
              type: "VenueSeatID"
              import: "github.com/iamconnor4/surge/internal/domain"
          - column: "venue_seats.venue_section_id"
            go_type:
              type: "VenueSectionID"
              import: "github.com/iamconnor4/surge/internal/domain"
          - column: "events.id"
            go_type:
              type: "EventID"
              import: "github.com/iamconnor4/surge/internal/domain"
          - column: "events.venue_id"
            go_type:
              type: "VenueID"
              import: "github.com/iamconnor4/surge/internal/domain"
          - column: "event_seats.id"
            go_type:
              type: "EventSeatID"
              import: "github.com/iamconnor4/surge/internal/domain"
          - column: "event_seats.event_id"
            go_type:
              type: "EventID"
              import: "github.com/iamconnor4/surge/internal/domain"
          - column: "event_seats.venue_seat_id"
            go_type:
              type: "VenueSeatID"
              import: "github.com/iamconnor4/surge/internal/domain"